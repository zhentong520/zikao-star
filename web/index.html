<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自考星">
<title>自考星</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="style.css">
</style>
</head>
<body>

<div id="boot">
  <div class="bootlogo">🌸</div>
  <div class="boott">自考星</div>
  <div class="boots" id="boots">正在读取你的备考数据…</div>
</div>
<div id="tg"></div>

<div id="app">
  <div class="sbar"><span class="num" id="clock">--:--</span><span>📶 🔋</span></div>

  <!-- ===== 首页 ===== -->
  <div class="screen on" id="s-home">
    <div class="scroll" id="h-scroll">
      <div class="appbar">
        <div><h1 id="greet">早安 🌷</h1><div class="sub" id="today">—</div></div>
        <div style="display:flex;gap:7px"><div class="ib" id="btnCrawl">🔄</div><div class="ib" onclick="go('news')">📰</div></div>
      </div>
      <div id="homeBody"></div>
    </div>
  </div>

  <!-- ===== 科目 ===== -->
  <div class="screen" id="s-courses">
    <div class="scroll">
      <div class="appbar">
        <div><h1>我的科目</h1><div class="sub" id="courseSub">—</div></div>
        <div class="ib" onclick="openSetup()">⚙️</div>
      </div>
      <div class="tabs" id="courseTabs"></div>
      <div id="courseBody"></div>
    </div>
  </div>

  <!-- ===== 科目详情 ===== -->
  <div class="screen" id="s-detail">
    <div class="scroll" id="detailScroll"></div>
    <div class="actionbar" id="detailBar"></div>
  </div>

  <!-- ===== 资讯 ===== -->
  <div class="screen" id="s-news">
    <div class="scroll">
      <div class="appbar">
        <h1>资讯</h1>
        <div class="ib" onclick="crawlNow(true)">🔄</div>
      </div>
      <div class="tabs" id="newsTabs">
        <div class="tabf on" data-c="全部">全部</div>
        <div class="tabf" data-c="时间">考试时间</div>
        <div class="tabf" data-c="报名">报名</div>
        <div class="tabf" data-c="考纲">考纲</div>
        <div class="tabf" data-c="学位">学位</div>
        <div class="tabf" data-c="成绩">成绩</div>
        <div class="tabf" data-c="政策">政策</div>
      </div>
      <div id="crawlStat" style="font-size:10.5px;color:var(--t3);padding:0 2px 9px"></div>
      <div id="newsBody"></div>
    </div>
  </div>

  <!-- ===== 资讯详情 ===== -->
  <div class="screen" id="s-article">
    <div class="scroll" id="artScroll"></div>
  </div>

  <!-- ===== 日历 ===== -->
  <div class="screen" id="s-cal">
    <div class="scroll">
      <div class="appbar"><h1>考试日历</h1><div class="ib" onclick="go('news')">📰</div></div>
      <div id="calBody"></div>
    </div>
  </div>

  <!-- ===== 学位 ===== -->
  <div class="screen" id="s-degree">
    <div class="scroll" id="degScroll"></div>
  </div>

  <!-- ===== 刷题（题库列表） ===== -->
  <div class="screen" id="s-quiz">
    <div class="scroll">
      <div class="appbar">
        <div><h1>刷题</h1><div class="sub" id="quizSub">—</div></div>
        <div class="ib" onclick="quizHelp()">?</div>
      </div>
      <div id="quizBody"></div>
    </div>
  </div>

  <!-- ===== 答题 ===== -->
  <div class="screen" id="s-run">
    <div class="scroll" id="runScroll"></div>
  </div>

  <div class="tabbar">
    <div class="tab on" data-s="home"><span class="ic">🏠</span>首页</div>
    <div class="tab" data-s="courses"><span class="ic">📚</span>科目</div>
    <div class="tab" data-s="quiz"><span class="ic">📝</span>刷题</div>
    <div class="tab" data-s="cal"><span class="ic">🗓</span>日历</div>
    <div class="tab" data-s="news"><span class="ic">📰</span>资讯</div>
    <div class="tab" data-s="degree"><span class="ic">🎓</span>学位</div>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><div class="shbar"></div>
    <div class="shh"><b id="shTitle">标题</b><div class="ib" onclick="closeSheet()">✕</div></div>
    <div id="shBody"></div>
  </div>
</div>

<script src="shared/rules.js"></script>
<script src="shared/calc.js"></script>
<script src="shared/store.js"></script>
<script src="shared/crawler-web.js"></script>
<script src="app.js"></script>
</body>
</html>
